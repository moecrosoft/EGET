[project]
name = "eget"
version = "0.1.0"
description = "EGET Agentic RAG Application"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "groq>=0.37.1",
    "langchain>=1.4.1",
    "langchain-groq>=1.1.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["frontend*", "data*", "infra*", "configs*"]
