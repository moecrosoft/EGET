# Template for `gcloud run deploy --env-vars-file=env.deploy.yaml`.
#
# Cloud Run's --env-vars-file needs YAML (`KEY: value`), NOT the .env file's
# dotenv syntax (`KEY=value`) — pointing --env-vars-file straight at .env
# will fail to parse or silently skip the variables. Copy this file to
# env.deploy.yaml (already gitignored) and fill in the same real values
# that are in your local .env.
#
# Deliberately excludes PORT — Cloud Run injects and manages its own PORT
# (defaults to 8080); server.js already falls back to 8080 on its own.
# Setting PORT here would make the container listen on the wrong port and
# fail Cloud Run's health check.

GROQ_API_KEY: gsk_your-key-here
LTA_ACCOUNT_KEY: your-lta-account-key-here
ONEMAP_TOKEN: your-onemap-token-here
MONITOR_INTERVAL_MS: "300000"

# Optional — only needed if you want /api/chat working in production.
# ANTHROPIC_API_KEY: sk-ant-your-key-here
